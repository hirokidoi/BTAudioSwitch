name: BTAudioSwitch
options:
  bundleIdPrefix: com.hirokidoi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 省略すると XcodeGen の既定が入る
settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  BTAudioSwitch:
    type: application
    platform: macOS
    sources:
      - path: Sources/BTAudioSwitch
      - path: Resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BTAudioSwitch
        PRODUCT_BUNDLE_IDENTIFIER: com.hirokidoi.btaudioswitch
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        # ソースを各自ビルドする配布のため ad-hoc 署名にする
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # IOBluetooth へのアクセスに Sandbox の entitlement を要さない構成にする
        ENABLE_APP_SANDBOX: NO
